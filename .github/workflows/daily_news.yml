name: Daily Morning News Email

on:
  schedule:
    - cron: '0 0 * * *'   # 12:00 AM UTC = 5:30 AM IST
    - cron: '30 0 * * *'  # 12:30 AM UTC = 6:00 AM IST  
    - cron: '0 1 * * *'   # 1:00 AM UTC = 6:30 AM IST
    - cron: '30 1 * * *'  # 1:30 AM UTC = 7:00 AM IST
    - cron: '0 2 * * *'   # 2:00 AM UTC = 7:30 AM IST
    - cron: '30 2 * * *'  # 2:30 AM UTC = 8:00 AM IST
    - cron: '0 3 * * *'   # 3:00 AM UTC = 8:30 AM IST
    - cron: '30 3 * * *'  # 3:30 AM UTC = 9:00 AM IST
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check IST time and run only between 9-10 AM IST
        env:
          SENDER_EMAIL:    ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:  ${{ secrets.RECEIVER_EMAIL }}
          GNEWS_KEY:       ${{ secrets.GNEWS_KEY }}
        run: |
          IST_HOUR=$(TZ='Asia/Kolkata' date +%H)
          IST_MIN=$(TZ='Asia/Kolkata' date +%M)
          echo "Current IST time: ${IST_HOUR}:${IST_MIN}"
          if [ "$IST_HOUR" -eq 9 ]; then
            echo "9 AM IST — Running news emailer!"
            python news_emailer.py
          else
            echo "Not 9 AM IST yet (${IST_HOUR}:${IST_MIN}). Skipping."
          fi
